[package]
name = "tailor-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tailor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.9"
glob = "0.3.3"
hex = "0.4.3"
reqwest = { version = "0.13.1", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tar = "0.4.44"
toml = "0.9.11"
walkdir = "2.5.0"
